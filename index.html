<!DOCTYPE html>
<html>
<head>
<title>Surprise 🎁</title>

<style>
body {
  margin: 0;
  background: black;
  color: white;
  text-align: center;
  font-family: Arial;
}

/* Surprise box */
.box {
  margin-top: 20%;
  display: inline-block;
  padding: 20px 40px;
  background: white;
  color: black;
  font-size: 30px;
  border-radius: 10px;
  cursor: pointer;
  transition: 0.3s;
}

.box:hover {
  background: gold;
  transform: scale(1.1);
}

/* Hidden message */
.message {
  display: none;
  margin-top: 20%;
  font-size: 50px;
  animation: glow 2s infinite alternate;
}

@keyframes glow {
  from { text-shadow: 0 0 10px gold; }
  to { text-shadow: 0 0 30px red, 0 0 50px yellow; }
}
</style>

<script>
function showMessage() {
  document.getElementById("box").style.display = "none";
  document.getElementById("msg").style.display = "block";

  // play music after click (browser allows audio only after click)
  document.getElementById("music").play();
}
</script>

</head>

<body>

<!-- Surprise Box -->
<div id="box" class="box" onclick="showMessage()">
🎁 Surprise
</div>

<!-- Happy New Year Message -->
<h1 id="msg" class="message">
हेर हेर मख्ख पर्या
  🎉 Happy New Year 🎉
     2083 
</h1>

<!-- Music -->
<audio id="music" loop>
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>

</body>
</html>
